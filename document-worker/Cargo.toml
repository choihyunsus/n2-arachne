[package]
name = "n2-arachne-doc"
version = "1.0.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
publish = false

[dependencies]
lopdf = { version = "0.47.0", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
serde_json = "1"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
